title = "ExhibitKit gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "exhibitkit-guest-key"
description = "ExhibitKit guest access key"
regex = '''(?i)EKIT-GUEST-[A-Z0-9]{4}-[A-Z0-9]{4}'''
keywords = ["ekit-guest"]

[[rules]]
id = "exhibitkit-founder-or-passphrase"
description = "Value assigned to a founder secret, or a quoted passphrase of at least 12 characters"
regex = '''(?i)(?:(?:FOUNDER_ADMIN_SECRET|DEFAULT_FOUNDER_SECRET)(?:['"`*_ \t]{0,12})[:=|]\s*['"`]?([A-Za-z0-9+/=._-]{8,})|passphrase(?:['"`*_ \t]{0,12})[:=|]\s*['"`]([^'"`\r\n]{12,})['"`])'''
keywords = [
  "founder_admin_secret",
  "default_founder_secret",
  "passphrase",
]

[rules.allowlist]
description = "A bare environment reference and this rule file are not secret values"
regexTarget = "secret"
regexes = ['''^process\.env\.[A-Z0-9_]+$''']
paths = ['''(^|/)\.gitleaks\.toml$''']

[[rules]]
id = "exhibitkit-secret-fallback"
description = "Quoted literal fallback for a founder secret or passphrase, on this line or the next"
regex = '''(?i)(?:FOUNDER_ADMIN_SECRET|DEFAULT_FOUNDER_SECRET|passphrase)[^\r\n]*\r?\n?[^\r\n]*?(?:\|\||\?\?)\s*['"`]([^'"`\r\n]{8,})['"`]'''
keywords = [
  "founder_admin_secret",
  "default_founder_secret",
  "passphrase",
]
